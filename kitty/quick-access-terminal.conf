# ─────────────────────────────────────────────────────────────
#  fg · kitty quick access terminal (quake window)
# ─────────────────────────────────────────────────────────────
#
# kitty's answer to ghostty's `global:cmd+#=toggle_visibility`: a panel that
# drops down from the top edge and toggles with a single command
#
#     kitten quick-access-terminal
#
# Running it again hides the window, so the same command is the toggle.
#
# kitty has NO global hotkey API, so the key itself has to come from outside.
# kitty.app ships a macOS Service for this: "Quick access to kitty".
# Assign a shortcut under System Settings → Keyboard → Keyboard Shortcuts →
# Services → General. Ghostty and Warp already configure cmd+# in this repo;
# choose a free shortcut when running more than one of these terminals.
#
# Everything not set here falls back to kitty.conf — same font, cursor and
# auto light/dark themes as a normal window.

# ═══ Geometry ════════════════════════════════════════════════
# A top-edge panel spans the full display width, so `columns` is ignored and
# only `lines` matters. Suffix px for a pixel height instead of a line count.

edge   top
lines  24

# ═══ Appearance ══════════════════════════════════════════════
# Slightly translucent so it reads as an overlay, not as a normal window.
# kitty.conf leaves windows fully opaque; this is the one exception.

background_opacity 0.95

# ═══ Behaviour ═══════════════════════════════════════════════
# Quake style: the panel disappears the moment focus goes elsewhere, so the
# hotkey is the only way in and out. Set to `no` to make it stay put.
# (This forces focus_policy on-demand — kitty does that itself.)

hide_on_focus_loss yes

# grab_keyboard has no effect on macOS: Apple does not let an app take the
# keyboard without special permissions. Left at the default on purpose.

# Per-window kitty overrides go here, e.g. a smaller font for the panel:
# kitty_override font_size=13
