# ─────────────────────────────────────────────────────────────
#  fg · kitty configuration
# ─────────────────────────────────────────────────────────────
#
# Design rule: tmux owns the multiplexing. kitty is a dumb, fast surface —
# no tab bar, no window splits. Anything that would create a kitty-level tab
# or split is remapped to spawn an OS window instead, because with the tab bar
# off those would be invisible.
#
# Mirrors ghostty/config and wezterm/wezterm.lua: same font, same cursor,
# same auto light/dark themes.

# ═══ Theme ═══════════════════════════════════════════════════
# Colors do NOT live here. kitty follows the macOS appearance through
# dark-theme.auto.conf / light-theme.auto.conf in this directory, and those
# override every color set in kitty.conf. Swap the theme pair there.

# ═══ Font ════════════════════════════════════════════════════
# "Hack Nerd Font Mono", not the "Hack Nerd Font" that ghostty and wezterm use:
# kitty only accepts strictly monospaced families and rejects the plain Nerd Font
# variant (its icon glyphs are double-width) with
# "font ... was not found, falling back to Menlo". Same typeface either way.

font_family      Hack Nerd Font Mono
font_size        14

# ═══ Cursor ══════════════════════════════════════════════════
# blink_interval 0 disables blinking outright.

cursor_shape           block
cursor_blink_interval  0

# ═══ Window ══════════════════════════════════════════════════

tab_bar_style            hidden
window_padding_width     6
scrollback_lines         10000
confirm_os_window_close  0

# tmux keeps 50k of its own scrollback; the number above is the fallback for
# panes running outside tmux.

# ═══ macOS ═══════════════════════════════════════════════════
# traditional_fullscreen = the fast transition without the Spaces animation,
# same as native_macos_fullscreen_mode = false in wezterm.
#
# option_as_alt stays off ON PURPOSE: on the German Mac layout Option is how
# you type @ | { } [ ] \. Turning it into Alt/Meta would make those characters
# untypable. Send Meta from tmux/nvim via Esc-prefix.
#
# kitty has no global (system-wide) hotkey API, so ghostty's
# `global:cmd+#=toggle_visibility` quake binding has no direct equivalent — the
# key now belongs to kitty and that ghostty line is commented out. The
# quake window itself exists — `kitten quick-access-terminal`, configured in
# quick-access-terminal.conf — but the hotkey has to come from outside: either
# the macOS Service kitty.app ships ("Quick access to kitty", bindable under
# System Settings → Keyboard → Keyboard Shortcuts → Services → General) or
# raycast/toggle-kitty-quick-access.sh. See that conf file for details.

macos_option_as_alt              no
macos_traditional_fullscreen     yes
macos_quit_when_last_window_closed no

# ═══ Startup ═════════════════════════════════════════════════
# session.conf just does `cd ~/dev` — the same start point as wezterm's
# default_cwd and the `d` alias.

startup_session session.conf

# ═══ Shell integration ═══════════════════════════════════════
# no-cursor: the shell must not fight the block cursor set above.
# Everything else (title, prompt marks, sudo) stays on.

shell_integration no-cursor

# ═══ Bell ════════════════════════════════════════════════════
# tmux forwards pane bells (monitor-bell on / bell-action any). Silent — no
# audible bell — but the window gets flagged and the Dock icon gets a badge.
# kitty has no "system notification on bell" option; agent banners come from
# scripts/agent-notify via OSC 99 instead.

enable_audio_bell        no
window_alert_on_bell     yes
macos_dock_badge_on_bell yes

# ═══ Keyboard ════════════════════════════════════════════════
# Every default that would create an invisible tab or split is remapped.

map cmd+t          new_os_window
map ctrl+shift+t   new_os_window
map ctrl+shift+enter new_os_window

map cmd+enter      toggle_fullscreen

# Clear the way iTerm does: wipe the scrollback, then let the shell redraw.
map cmd+k combine : clear_terminal scrollback active : send_text normal,application \x0c

# New OS window straight into the tmux project picker (scripts/tmux_session).
map cmd+shift+t launch --type=os-window /bin/zsh -l -c "tmux_session; exec /bin/zsh -l"
