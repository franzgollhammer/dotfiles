# XTerm Dark
# Ported 1:1 from ghostty/themes/xterm-dark. Keep in sync when that changes.
# ghostty `palette = 0..15` maps to kitty `color0..color15`.

background            #000000
foreground            #ffffff
cursor                #ffffff
cursor_text_color     #000000

# Normal colors (0-7)
color0                #000000
color1                #cd0000
color2                #00cd00
color3                #cdcd00
color4                #0000ee
color5                #cd00cd
color6                #00cdcd
color7                #e5e5e5

# Bright colors (8-15)
color8                #7f7f7f
color9                #ff0000
color10               #00ff00
color11               #ffff00
color12               #5c5cff
color13               #ff00ff
color14               #00ffff
color15               #ffffff
