"$schema" = 'https://starship.rs/config-schema.json'

# fg@devbox …/dev/dotfiles git:(main)[!?] node:(v22.11.0) %
format = "($username([@](bold green)$hostname) )$directory($git_branch$git_commit$git_status$git_metrics )$nodejs$bun$character"

[username]
show_always = true
style_user = "bold"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold"
format = "[$hostname]($style)"

[character]
success_symbol = "[%](bold)"
error_symbol = "[%](bold red)"

[git_branch]
only_attached = true
format = '[git:\(](bold)[$branch](bold purple)[\)](bold)'

# Detached HEAD: robbyrussell shows the short sha in place of the branch
[git_commit]
format = '[git:\(](bold)[$hash$tag](bold red)[\)](bold)'

[git_status]
ahead = '↑'
behind = '↓'
diverged = '↑↓'
format = '([\[](bold)[$all_status$ahead_behind]($style)[\]](bold))'

[git_metrics]
disabled = false
format = '([\[](bold)([+$added]($added_style))([-$deleted]($deleted_style))[\]](bold))'

[nodejs]
style = "bold green"
format = '[node:\(](bold)[$version]($style)[\)](bold) '

[bun]
style = "bold yellow"
format = '[bun:\(](bold)[$version]($style)[\)](bold) '
