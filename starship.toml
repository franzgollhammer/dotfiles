"$schema" = 'https://starship.rs/config-schema.json'

# fg@devbox …/dev/dotfiles git:(main)[!?] node:(v22.11.0) %
format = "($username([@](bold blue)$hostname) )$directory($git_branch$git_commit$git_status$git_metrics )$nodejs$bun$character"

[username]
# show_always = true
style_user = "bold green"
format = "[$user]($style)"

[hostname]
# ssh_only = false
style = "bold green"
format = "[$hostname]($style)"

[character]
success_symbol = "[%](bold green)"
error_symbol = "[%](bold red)"

[git_branch]
only_attached = true
format = '[git:\(](bold blue)[$branch](bold purple)[\)](bold blue)'

# Detached HEAD: robbyrussell shows the short sha in place of the branch
[git_commit]
format = '[git:\(](bold blue)[$hash$tag](bold red)[\)](bold blue)'

[git_status]
ahead = '↑'
behind = '↓'
diverged = '↑↓'
format = '([\[](bold blue)[$all_status$ahead_behind]($style)[\]](bold blue))'

[git_metrics]
disabled = false
format = '([\[](bold blue)([+$added]($added_style))([-$deleted]($deleted_style))[\]](bold blue))'

[nodejs]
style = "bold green"
format = '[node:\(](bold blue)[$version]($style)[\)](bold blue) '

[bun]
style = "bold yellow"
format = '[bun:\(](bold blue)[$version]($style)[\)](bold blue) '
