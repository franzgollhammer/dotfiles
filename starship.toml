"$schema" = 'https://starship.rs/config-schema.json'

# oh-my-zsh robbyrussell look, plus node version, 2-level directory truncation and time:
# …/dev/dotfiles git:(main)[!?] node:(v22.11.0)          at 14:03:22
# ➜
# add_newline = true
format = "$directory($git_branch$git_commit$git_status )$nodejs$fill$time$line_break$character"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 2
truncation_symbol = '…/'
truncate_to_repo = false

[git_branch]
format = '[git:\(](bold blue)[$branch](bold red)[\)](bold blue)'

# Detached HEAD: robbyrussell shows the short sha in place of the branch
[git_commit]
format = '[git:\(](bold blue)[$hash$tag](bold red)[\)](bold blue)'

[git_status]
# style = "bold purple"
format = '([\[](bold blue)[$all_status$ahead_behind]($style)[\]](bold blue))'

[fill]
symbol = " "

[time]
disabled = false

[nodejs]
style = "bold green"
format = '[node:\(](bold blue)[$version]($style)[\)](bold blue) '
