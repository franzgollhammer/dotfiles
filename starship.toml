"$schema" = 'https://starship.rs/config-schema.json'

# oh-my-zsh robbyrussell look, plus node + bun version, 2-level directory truncation and time.
# Over SSH, user@host leads the line:
# fg@devbox …/dev/dotfiles git:(main)[!?] node:(v22.11.0) %                  [14:03:22]
# Time is right_format (zsh RPROMPT) so the cursor stays right after the %.
format = "($username([@](bold blue)$hostname) )$directory($git_branch$git_commit$git_status$git_metrics )$nodejs$bun$character"
right_format = "$time"

# Shown on SSH (and as root); hostname only on SSH
[username]
style_user = "bold yellow"
format = "[$user]($style)"

[hostname]
style = "bold yellow"
format = "[$hostname]($style)"

[character]
success_symbol = "[% ](bold green)"
error_symbol = "[% ](bold red)"

[directory]
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 2
truncation_symbol = '…/'
truncate_to_repo = false

[git_branch]
only_attached = true
format = '[git:\(](bold blue)[$branch](bold red)[\)](bold blue)'

# Detached HEAD: robbyrussell shows the short sha in place of the branch
[git_commit]
format = '[git:\(](bold blue)[$hash$tag](bold red)[\)](bold blue)'

[git_status]
ahead = '↑'
behind = '↓'
diverged = '↑↓'
format = '([\[](bold blue)[$all_status$ahead_behind]($style)[\]](bold blue))'

[git_metrics]
disabled = false
format = '([\[](bold blue)[+$added]($added_style)[\]](bold blue))([\[](bold blue)[-$deleted]($deleted_style)[\]](bold blue))'

[time]
disabled = false
time_format = "%T"
format = '[\[](bold blue)[$time]($style)[\]](bold blue) '

[nodejs]
style = "bold green"
format = '[node:\(](bold blue)[$version]($style)[\)](bold blue) '

[bun]
style = "bold yellow"
format = '[bun:\(](bold blue)[$version]($style)[\)](bold blue) '
