"$schema" = 'https://starship.rs/config-schema.json'

# fg@devbox …/dev/franzgollhammer/dotfiles git:(main)[!?] node:(v22.11.0) %
format = "($username([@](bold green)$hostname):)$directory($git_branch$git_commit$git_status$git_metrics )$nodejs$bun$golang$lua$python$line_break$status$shell"

# Colors follow Ubuntu's default PS1: user@host bold green, path bold blue
[username]
show_always = true
style_user = "bold green"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold green"
format = "[$hostname]($style)"

# The prompt symbol follows the running shell, as its own default prompt
# would: zsh %, bash $ (bash itself turns \$ into # for root), fish >.
# The character module cannot vary per shell, so the shell module takes its
# place and a failed command shows its exit code in red before the symbol.
[shell]
disabled = false
zsh_indicator = "%"
bash_indicator = '\$'
fish_indicator = ">"
tcsh_indicator = "%"
nu_indicator = ">"
powershell_indicator = "PS>"
cmd_indicator = ">"
unknown_indicator = ">"
style = "bold"
format = "[$indicator]($style) "

[status]
disabled = false
style = "bold red"
format = "[$status]($style) "

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 2
truncation_symbol = '…/'
truncate_to_repo = false

[git_branch]
only_attached = true
format = '[git:\(](bold)[$branch](bold purple)[\)](bold)'

# Detached HEAD: robbyrussell shows the short sha in place of the branch
[git_commit]
format = '[git:\(](bold)[$hash$tag](bold red)[\)](bold)'

[git_status]
ahead = '↑'
behind = '↓'
diverged = '↑↓'
format = '([\[](bold)[$all_status$ahead_behind]($style)[\]](bold))'

[git_metrics]
disabled = false
format = '([\[](bold)([+$added]($added_style))([-$deleted]($deleted_style))[\]](bold))'

[nodejs]
style = "bold green"
format = '[node:\(](bold)[$version]($style)[\)](bold) '

[bun]
style = "bold yellow"
format = '[bun:\(](bold)[$version]($style)[\)](bold) '

[golang]
style = "bold cyan"
format = '([go:\(](bold)[$version]($style)[\)](bold) )'

[lua]
style = "bold blue"
format = '([lua:\(](bold)[$version]($style)[\)](bold) )'

[python]
style = "bold yellow"
format = '([python:\(](bold)[$version]($style)[\)](bold) )'
