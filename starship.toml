"$schema" = 'https://starship.rs/config-schema.json'

# oh-my-zsh robbyrussell look, plus node version, 2-level directory truncation and time.
# Over SSH, user@host leads the line:
# fg@devbox …/dev/dotfiles git:(main)[!?] node:(v22.11.0)          at 14:03:22
# ➜
format = "($username([@](bold blue)$hostname) )$directory($git_branch$git_commit$git_status$git_metrics )$nodejs$fill$time$line_break$character"

# Shown on SSH (and as root); hostname only on SSH
[username]
style_user = "bold yellow"
format = "[$user]($style)"

[hostname]
style = "bold yellow"
format = "[$hostname]($style)"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 2
truncation_symbol = '…/'
truncate_to_repo = false

[git_branch]
only_attached = true
format = '[git:\(](bold blue)[$branch](bold red)[\)](bold blue)'

# Detached HEAD: robbyrussell shows the short sha in place of the branch
[git_commit]
format = '[git:\(](bold blue)[$hash$tag](bold red)[\)](bold blue)'

[git_status]
format = '([\[](bold blue)[$all_status$ahead_behind]($style)[\]](bold blue))'

[git_metrics]
disabled = false
format = '([\[](bold blue)[+$added]($added_style)[\]](bold blue))([\[](bold blue)[-$deleted]($deleted_style)[\]](bold blue))'

[fill]
symbol = " "

[time]
disabled = false

[nodejs]
style = "bold green"
format = '[node:\(](bold blue)[$version]($style)[\)](bold blue) '
