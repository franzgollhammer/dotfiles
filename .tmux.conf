# Reload the config with prefix + r.
unbind r
bind r source-file ~/.tmux.conf

# Terminal behavior
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on
set -g mouse on

# Pass bells and terminal notifications through to the host terminal.
set -g bell-action any
set -g monitor-bell on
set -g allow-passthrough on


# Status bar
set -g status-interval 1
set -g status-position top
set -g status-style 'bg=default fg=default'
set -g status-left-length 32
set -g status-right-length 80
set -g status-left '#[fg=default bold][#S] '
set -g status-right '#[fg=default bold][#(cd #{pane_current_path}; git branch --show-current 2>/dev/null || echo "no-git")]#[fg=default bold][#{USER}@#H]'
set -g window-status-format '(#I):#W#F'
set -g window-status-current-format '#[fg=green bold](#I)#[fg=default bold]:#[fg=green bold]#W#F'

# Click the session name to open the session overview.
bind -n MouseDown1StatusLeft choose-tree -Zs

# Windows and panes
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -gu pane-border-format
set -g pane-border-status top

# Pane navigation
set -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n C-Left select-pane -L
bind -n C-Down select-pane -D
bind -n C-Up select-pane -U
bind -n C-Right select-pane -R

# Open new panes and windows in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Copy to the macOS clipboard.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Project shortcuts
bind f run-shell "tmux neww tmux_session"
bind g new-window -c "#{pane_current_path}" lazygit
