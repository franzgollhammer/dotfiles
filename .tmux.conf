# Reload the config with prefix + r.
unbind r
bind r source-file ~/.tmux.conf

# Terminal behavior
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on
set -g mouse on

# Pass bells and terminal notifications through to the host terminal.
set -g bell-action any
set -g monitor-bell on
set -g allow-passthrough on

# Status
set -g status-interval 1
set -g status-position top
set -g status-left-length 32
set -g status-style 'bg=default fg=brightgreen'
set -g window-status-current-style 'bg=brightgreen fg=default'

# Windows and panes
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Pane navigation
set -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with Shift + Arrow keys
bind -n S-Left resize-pane -L 5
bind -n S-Down resize-pane -D 5
bind -n S-Up resize-pane -U 5
bind -n S-Right resize-pane -R 5

# Copy to the macOS clipboard.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'
