# Reload the config with prefix + r.
unbind r
bind r source-file ~/.tmux.conf

# Terminal behavior
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ',xterm*:sync'
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on
set -g mouse on

# Pass bells and terminal notifications through to the host terminal.
set -g bell-action any
set -g visual-bell both
set -g monitor-bell on
set -g allow-passthrough on

# Status
set -g status-interval 1
set -g status-position top
set -g status-left-length 32
set -g status-left '[#S] '
set -g status-right ' [#{USER}@#H]'
set -g window-status-current-style 'fg=blue bold'

# Prefix + w or a click on the session name opens the fully expanded tree.
bind w choose-tree -Z
bind -n MouseDown1StatusLeft choose-tree -Z

# Windows and panes
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Pane navigation
set -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Release Shift + Arrow keys, including after reloading an older config.
unbind -n S-Left
unbind -n S-Down
unbind -n S-Up
unbind -n S-Right

# Pane resizing with Ctrl + Shift + Arrow keys
bind -n C-S-Left resize-pane -L 5
bind -n C-S-Down resize-pane -D 5
bind -n C-S-Up resize-pane -U 5
bind -n C-S-Right resize-pane -R 5
