# Reload the config with prefix + r.
unbind r
bind r source-file ~/.tmux.conf

# Terminal behavior
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on
set -g mouse on

# Pass bells and terminal notifications through to the host terminal.
set -g bell-action any
set -g monitor-bell on
set -g allow-passthrough on

# Windows and panes
set -g status-position top
set -g status-style "bg=default,fg=default"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -gu pane-border-format
set -g pane-border-status top

# Pane navigation
set -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n C-Left select-pane -L
bind -n C-Down select-pane -D
bind -n C-Up select-pane -U
bind -n C-Right select-pane -R

# Open new panes and windows in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Copy to the macOS clipboard.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Project shortcuts
bind f run-shell "tmux neww tmux_session"
bind g new-window -c "#{pane_current_path}" lazygit
